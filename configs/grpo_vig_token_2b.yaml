# VIG-only + token 级别计算（无步骤切分），w_vig=1.0，500步
# 模型：Qwen3-VL-2B-Thinking
#
# 与 grpo_vig_token.yaml（8B）的关键差异：
#   - model_name_or_path / output_dir 更换为 2B
#   - per_device_train_batch_size: 1，gradient_accumulation_steps: 4
#   - vllm_gpu_memory_utilization: 0.5（2B 模型）
#   - 加速配置: configs/accelerate_zero2_small.yaml
#
# VIG 说明（token 级别）：
#   vig_step_split_mode="token" 表示不做步骤切分，以整个 <think> 块为单元
#   在 token 粒度上直接平均 VIG，即 R_VIG = clip(avg_token_VIG - baseline, -1, 1)
#   这是本实验默认的 VIG 计算方式。

# ---- 模型 ----
model_name_or_path: "Qwen/Qwen3-VL-2B-Thinking"
output_dir: "./output/grpo_vig_token_2b"

# ---- 数据 ----
data_cache_dir: "./hf_cache/datasets"
max_per_source: null
sources:
  - mmstar
  - mathvista
  - logicvista

# ---- GRPO 超参 ----
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
warmup_steps: 10
max_steps: 500
group_size: 8
temperature: 1.0
top_p: 0.95
max_new_tokens: 2048
kl_coef: 0.04

# ---- 损失函数 ----
loss_type: "grpo"
epsilon: 0.2
epsilon_high: null
mask_truncated_completions: false

# ---- 奖励 ----
w_format: 0.1
w_acc: 1.0
w_vig: 1.0
w_soft_overlong: 0.0

# ---- VIG algorithm parameters（token 级别 VIG）----
vig_score_mode: "vig_only"            # KeepScore = VIG（KeepScore = VIG only）
vig_comparison_mode: "no_image"       # VIG = H_txt - H_vis
vig_step_split_mode: "token"          # token 级别：不做步骤切分，直接 token 均值
vig_mask_ratio: 0.5
vig_lambda: 1.0
vig_mu: 1.0
vig_baseline: 0.0
vig_max_steps: null
vig_aggregation_mode: "mean"
vig_split_high_variance: false
vig_variance_threshold: 2.0
vig_gamma: 0.0
vig_position_weight: false
vig_zscore_norm: false

# ---- 日志和保存 ----
logging_steps: 1
save_steps: 100
report_to: "tensorboard"

# ---- 其他 ----
seed: 42
dataloader_num_workers: 4
gradient_checkpointing: true
vllm_gpu_memory_utilization: 0.5
