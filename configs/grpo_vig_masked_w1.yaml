# VIG-only + masked_image（50% patch）+ clip，w_vig=1.0，500步
# 对照：
#   (early ablation config, not released)：the early H_vis-weighted variant + masked_image，w=0.3，无 clip
#   本实验：VIG-only + masked_image，w=1.0，有 clip
# 意义：
#   将 VIG 的对比 forward 从"去掉图像"改为"mask 50% patch"，
#   测试更弱的视觉扰动下 VIG 信号的质量是否优于完全无图版本。
#   VIG_masked = H_masked - H_vis（H_masked 用半遮挡图前向）

# ---- 模型 ----
model_name_or_path: "Qwen/Qwen3-VL-8B-Thinking"
output_dir: "./output/grpo_vig_masked_w1"

# ---- 数据 ----
data_cache_dir: "./hf_cache/datasets"
max_per_source: null
sources:
  - mmstar
  - mathvista
  - logicvista

# ---- GRPO 超参 ----
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
warmup_steps: 10
max_steps: 500
group_size: 8
temperature: 1.0
top_p: 0.95
max_new_tokens: 2048
kl_coef: 0.04

# ---- 损失函数 ----
loss_type: "grpo"
epsilon: 0.2
epsilon_high: null
mask_truncated_completions: false

# ---- 奖励 ----
w_format: 0.1
w_acc: 1.0
w_vig: 1.0                            # 与 grpo_vig_w1 相同
w_soft_overlong: 0.0

# ---- VIG algorithm parameters ----
vig_score_mode: "vig_only"            # KeepScore = VIG_masked = H_masked - H_vis
vig_comparison_mode: "masked_image"   # 关键改动：no_image → masked_image
vig_mask_ratio: 0.5                   # 随机 mask 50% patch（14×14 单位）
vig_lambda: 1.0
vig_mu: 1.0
vig_baseline: 0.0
vig_max_steps: null
vig_aggregation_mode: "mean"
vig_split_high_variance: false
vig_variance_threshold: 2.0
vig_gamma: 0.0
vig_position_weight: false
vig_zscore_norm: false

# ---- 日志和保存 ----
logging_steps: 1
save_steps: 100
report_to: "tensorboard"

# ---- 其他 ----
seed: 42
dataloader_num_workers: 4
gradient_checkpointing: true
vllm_gpu_memory_utilization: 0.25
