# GRPO 对比方法 3: ThinkPrune Stage 1 (budget=2048)
# 论文：https://arxiv.org/abs/2504.01296

# ---- 模型 ----
model_name_or_path: "Qwen/Qwen3-VL-8B-Thinking"
output_dir: "./output/grpo_thinkprune_stage1"

# ---- 数据 ----
data_cache_dir: "./hf_cache/datasets"
max_per_source: null
sources:
  - mmstar
  - mathvista
  - logicvista

# ---- GRPO 超参 ----
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
warmup_steps: 10
max_steps: 500
group_size: 8
temperature: 1.0
top_p: 0.95
max_new_tokens: 2048
kl_coef: 0.04

# ---- 奖励：ThinkPrune ----
reward_type: "thinkprune"
thinkprune_budget: 2048
thinkprune_truncate_at_budget: true
w_acc: 1.0
w_format: 0.1

# ---- 日志和保存 ----
logging_steps: 1
save_steps: 100
report_to: "tensorboard"

# ---- 其他 ----
seed: 42
dataloader_num_workers: 4
gradient_checkpointing: true
