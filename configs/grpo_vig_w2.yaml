# VIG-only + clip，w_vig=2.0，500步
# 对照：
#   grpo_vig_w05.yaml：VIG-only，w_vig=0.5，有 clip
#   本实验：VIG 权重推至 2.0，测试信号饱和点
# 意义：VIG ∈ (0, ~0.3)，clip 后 R_VIG ∈ (-1, 0.3)，
#       w=2.0 时 VIG 对总奖励贡献 ≤ 0.6，仍低于 R_acc 的 1.0，理论上可稳定。

# ---- 模型 ----
model_name_or_path: "Qwen/Qwen3-VL-8B-Thinking"
output_dir: "./output/grpo_vig_w2"

# ---- 数据 ----
data_cache_dir: "./hf_cache/datasets"
max_per_source: null
sources:
  - mmstar
  - mathvista
  - logicvista

# ---- GRPO 超参 ----
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
warmup_steps: 10
max_steps: 500
group_size: 8
temperature: 1.0
top_p: 0.95
max_new_tokens: 2048
kl_coef: 0.04

# ---- 损失函数（与其他 VIG 实验保持一致）----
loss_type: "grpo"
epsilon: 0.2
epsilon_high: null
mask_truncated_completions: false

# ---- 奖励 ----
w_format: 0.1
w_acc: 1.0
w_vig: 2.0                            # 关键改动：0.3 → 2.0
w_soft_overlong: 0.0                   # 不启用 soft overlong

# ---- VIG algorithm parameters ----
vig_score_mode: "vig_only"            # KeepScore = VIG
vig_comparison_mode: "no_image"
vig_mask_ratio: 0.5
vig_lambda: 1.0
vig_mu: 1.0
vig_baseline: 0.0
vig_max_steps: null
vig_aggregation_mode: "mean"
vig_split_high_variance: false
vig_variance_threshold: 2.0
vig_gamma: 0.0
vig_position_weight: false
vig_zscore_norm: false

# ---- 日志和保存 ----
logging_steps: 1
save_steps: 100
report_to: "tensorboard"

# ---- 其他 ----
seed: 42
dataloader_num_workers: 4
gradient_checkpointing: true
vllm_gpu_memory_utilization: 0.25
