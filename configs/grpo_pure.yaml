# GRPO 对比方法 1: Pure GRPO（纯粹 GRPO 基线）
# 奖励：R_format + R_acc（无任何长度约束）
# 用途：作为不加任何长度压缩的 GRPO 上界基线，与 VIG/L1/ThinkPrune 对比

# ---- 模型 ----
model_name_or_path: "Qwen/Qwen3-VL-8B-Thinking"
output_dir: "./output/grpo_pure"

# ---- 数据 ----
data_cache_dir: "./hf_cache/datasets"
max_per_source: null
sources:
  - mmstar
  - mathvista
  - logicvista

# ---- GRPO 超参 ----
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
warmup_steps: 10
max_steps: 500
group_size: 8
temperature: 1.0
top_p: 0.95
max_new_tokens: 2048
kl_coef: 0.04

# ---- 奖励 ----
reward_type: "pure"
w_format: 0.1
w_acc: 1.0

# ---- 日志和保存 ----
logging_steps: 1
save_steps: 100
report_to: "tensorboard"

# ---- 其他 ----
seed: 42
dataloader_num_workers: 4
gradient_checkpointing: true
